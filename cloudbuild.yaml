substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: projectflow-edu
  _FIRESTORE_DATABASE: "(default)"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: validate-and-extract-user
    name: bash:5.2
    entrypoint: bash
    args:
      - -ceu
      - |
        set -o pipefail

        # 허용된 사용자 ID 목록
        ALLOWED_USERS="junnyunk kcjang7 namss seulki go23 hyungjin_moon spy28 hgpark05 jsbyeon jbyun spjeong bkchoi21 mcolors"

        # 브랜치명에서 edu/ 제거
        BRANCH_SUFFIX="${BRANCH_NAME#edu/}"

        if [[ -z "${BRANCH_SUFFIX}" ]]; then
          echo "ERROR: 브랜치명 파싱 실패 (edu/ 이후가 비어있음)"
          exit 1
        fi

        # -projectflow 접미사 제거
        USER_ID="${BRANCH_SUFFIX%-projectflow}"

        # 접미사 제거 후 빈 문자열 체크
        if [[ -z "${USER_ID}" ]]; then
          echo "ERROR: 사용자 ID가 비어있음"
          exit 1
        fi

        # 허용된 사용자 검증
        if ! echo "${ALLOWED_USERS}" | grep -w "${USER_ID}" > /dev/null; then
          echo "ERROR: 허용되지 않은 사용자 ID: ${USER_ID}"
          echo "허용된 사용자: ${ALLOWED_USERS}"
          exit 1
        fi

        # Cloud Run 서비스명용 정규화 (언더스코어 → 하이픈, 대문자 → 소문자)
        NORMALIZED_ID="$(echo "${USER_ID}" | tr '_' '-' | tr '[:upper:]' '[:lower:]')"

        SERVICE_NAME="projectflow-edu-${NORMALIZED_ID}"
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${SERVICE_NAME}:${SHORT_SHA}"

        # 파일에 저장
        printf '%s' "${USER_ID}" > /workspace/.user_id
        printf '%s' "${SERVICE_NAME}" > /workspace/.service_name
        printf '%s' "${IMAGE}" > /workspace/.image

        echo "✓ 사용자 검증 완료"
        echo "  USER_ID: ${USER_ID}"
        echo "  SERVICE_NAME: ${SERVICE_NAME}"

  - id: frontend-install
    name: node:22-alpine
    dir: frontend
    entrypoint: npm
    args: ["ci"]

  - id: frontend-typecheck
    name: node:22-alpine
    dir: frontend
    entrypoint: npm
    args: ["run", "typecheck"]

  - id: frontend-build
    name: node:22-alpine
    dir: frontend
    entrypoint: npm
    args: ["run", "build"]

  - id: backend-test
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest -q

  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build \
          -t "$(cat /workspace/.image)" \
          .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker push "$(cat /workspace/.image)"

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        USER_ID="$(cat /workspace/.user_id)"
        SERVICE_NAME="$(cat /workspace/.service_name)"
        IMAGE="$(cat /workspace/.image)"

        gcloud run deploy "${SERVICE_NAME}" \
          --image "${IMAGE}" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "APP_ENV=education,WORKSPACE_ID=${USER_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},DB_SCHEMA=${USER_ID}" \
          --set-secrets="DATABASE_URL=team_edu_db_url:latest" \
          --min-instances 0 \
          --max-instances 2 \
          --memory 512Mi \
          --cpu 1 \
          --quiet

  - id: health-check
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_NAME="$(cat /workspace/.service_name)"
        export SERVICE_URL="$(
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${_REGION}" \
            --format='value(status.url)'
        )"

        echo "Health check 시작: ${SERVICE_URL}/api/health"

        python3 - <<'PY'
        import os
        import time
        import urllib.request

        url = os.environ["SERVICE_URL"].rstrip("/") + "/api/health"
        last_error = None

        for attempt in range(12):
            try:
                with urllib.request.urlopen(url, timeout=15) as response:
                    if response.status == 200:
                        print(f"✓ Health check PASS: {url}")
                        raise SystemExit(0)
            except Exception as exc:
                last_error = exc
                remaining = 12 - attempt - 1
                print(f"  시도 {attempt + 1}/12 실패 ({remaining}회 남음): {type(exc).__name__}")
                if remaining > 0:
                    time.sleep(5)

        raise SystemExit(f"✗ Health check 실패: {last_error}")
        PY
